[test]
# Mirrors the old jest `coverageDirectory` / `collectCoverageFrom` settings.
coverageDir = "coverage"
coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "./src/common/constants/*",
  "./src/common/helpers/*",
  "./src/config/**",
  "./src/modules/db/**",
]
